_comment: Project Reclaimer dedicated server on Pelican (custom Wine image)
meta:
  version: PLCN_v3
  update_url: null
exported_at: '2026-10-11T15:16:53+00:00'
name: Project Reclaimer
author: admin@localhost
uuid: 0e7c60b1-d52d-43f8-83d3-ee659b44700b
description: Project Reclaimer (Halo 3) dedicated server under Wine. One game server per panel server, on its default allocation (UDP). Upload Halo 3's files from your own MCC install into game/ before the first start.
tags:
- halo
- wine
features: []
docker_images:
  Reclaimer Wine: ghcr.io/YOUR-ORG/reclaimer-wine:latest
file_denylist: []
startup_commands:
  Default: wine project-reclaimer.exe dedicated
config:
  files:
    dedicated.toml:
      parser: file
      find:
        'name = ': name = "{{server.environment.SERVER_NAME}}"
        'port = ': port = {{server.allocations.default.port}}
  startup:
    done: Hole punching ready
  logs: {}
  stop: ^C
scripts:
  installation:
    script: |
      #!/bin/bash
      # Project Reclaimer installer for Pelican. Runs in the installer container
      # with the server volume at /mnt/server (override with INSTALL_DIR to test).
      set -euo pipefail

      DIR="${INSTALL_DIR:-/mnt/server}"
      REPO="https://github.com/ProjectReclaimer/project-reclaimer-releases/releases"
      TAG="${RELEASE_TAG:-latest}"

      if ! command -v curl >/dev/null || ! command -v sha256sum >/dev/null; then
          apt-get update -qq && apt-get install -y -qq curl ca-certificates coreutils >/dev/null
      fi

      mkdir -p "${DIR}"
      cd "${DIR}"
      mkdir -p game content/Maps "content/Game Modes" content/Mods playlists data

      # The checksum list names every asset, so it tells us the dedicated build's
      # file name (and its version) without the rate-limited GitHub API.
      if [ "${TAG}" = "latest" ]; then
          SUMS_URL="${REPO}/latest/download/SHA256SUMS.txt"
      else
          SUMS_URL="${REPO}/download/${TAG}/SHA256SUMS.txt"
      fi
      echo "Reading release checksums: ${SUMS_URL}"
      SUMS=$(curl -fsSL "${SUMS_URL}") || { echo "Could not download ${SUMS_URL}. Check the Release Tag variable."; exit 1; }

      LINE=$(echo "${SUMS}" | grep -E '[[:space:]]\*?project-reclaimer-dedicated-v?[0-9][^[:space:]]*\.exe$' | head -n1 || true)
      if [ -z "${LINE}" ]; then
          echo "This release has no project-reclaimer-dedicated-*.exe (it first shipped in 0.8.14). Assets listed:"
          echo "${SUMS}"
          exit 1
      fi
      EXPECTED=$(echo "${LINE}" | awk '{print $1}')
      EXE_NAME=$(echo "${LINE}" | awk '{print $2}' | tr -d '*')
      VERSION=$(echo "${EXE_NAME}" | sed -E 's/^project-reclaimer-dedicated-(.*)\.exe$/\1/')

      echo "Downloading ${EXE_NAME}"
      curl -fsSL -o project-reclaimer.exe.part "${REPO}/download/${VERSION}/${EXE_NAME}"

      ACTUAL=$(sha256sum project-reclaimer.exe.part | awk '{print $1}')
      if [ "${ACTUAL}" != "${EXPECTED}" ]; then
          echo "Checksum mismatch for ${EXE_NAME}: expected ${EXPECTED}, got ${ACTUAL}"
          rm -f project-reclaimer.exe.part
          exit 1
      fi
      mv -f project-reclaimer.exe.part project-reclaimer.exe
      echo "${VERSION}" > .reclaimer-version
      echo "Installed Project Reclaimer ${VERSION} (sha256 verified)"

      # A starting config, only if there isn't one. The panel rewrites the
      # [[server]] name and port lines at every start (see the egg's config).
      if [ ! -f dedicated.toml ]; then
          echo "Writing dedicated.toml"
          cat > dedicated.toml <<'EOF'
      # Project Reclaimer: one server per Pelican server.
      #
      # Managed by the panel, do not edit here:
      #   - the [[server]] "name = " and "port = " lines (Startup tab / allocation)
      #   - host name, admins, join password, max players (Startup tab variables,
      #     which override this file through RECLAIMER_DEDICATED_* env vars)
      #   - this machine's master is off; servers still list on the public masters
      # Keep a single [[server]] block, and keep "name =" and "port =" unindented
      # at the start of their lines, or the panel can't update them.
      game = "game"
      content = "content"
      public_address = ""
      upnp = false
      auto_update = false

      [rcon]
      address = "127.0.0.1"

      [defaults]
      max_players = 16

      [[server]]
      name = "Reclaimer"
      port = 49176
      map = "Guardian"
      game = "Slayer"
      EOF
      fi

      echo "Done. Upload Halo 3's files into game/ over SFTP before the first start."
    container: ghcr.io/pelican-eggs/installers:debian
    entrypoint: bash
variables:
- sort: 1
  name: Server Name
  description: Shown in the Server Browser. Up to 48 characters, no double quotes or backslashes.
  env_variable: SERVER_NAME
  default_value: Reclaimer
  user_viewable: true
  user_editable: true
  rules:
  - required
  - string
  - max:48
  - regex:/^[^"\\]+$/
- sort: 2
  name: Host Name
  description: Shown under the server's name in the browser and lobby. Empty uses dedicated.toml.
  env_variable: RECLAIMER_DEDICATED_HOST_NAME
  default_value: ''
  user_viewable: true
  user_editable: true
  rules:
  - nullable
  - string
  - max:64
- sort: 3
  name: Admin Player IDs
  description: 64-character player IDs (Settings > Online services in the client), separated by commas. Admins can kick and ban in game.
  env_variable: RECLAIMER_DEDICATED_ADMINS
  default_value: ''
  user_viewable: true
  user_editable: true
  rules:
  - nullable
  - string
  - max:2000
- sort: 4
  name: Max Players
  description: Players admitted at once, 1 to 127. Large games need about a CPU core and 0.6 to 0.9 GB.
  env_variable: RECLAIMER_DEDICATED_MAX_PLAYERS
  default_value: '16'
  user_viewable: true
  user_editable: true
  rules:
  - required
  - integer
  - between:1,127
- sort: 5
  name: Join Password
  description: Leave empty for a public server.
  env_variable: RECLAIMER_DEDICATED_PASSWORD
  default_value: ''
  user_viewable: true
  user_editable: true
  rules:
  - nullable
  - string
  - max:128
- sort: 6
  name: Release Tag
  description: Project Reclaimer version the installer downloads, such as v0.9.13. Reinstall the server to apply. Players must run the same version.
  env_variable: RELEASE_TAG
  default_value: latest
  user_viewable: true
  user_editable: true
  rules:
  - required
  - string
  - max:40
- sort: 7
  name: Virtual Display
  description: 1 runs Xvfb for Wine. Leave on unless you know the server runs without it.
  env_variable: XVFB
  default_value: '1'
  user_viewable: true
  user_editable: true
  rules:
  - required
  - in:0,1
- sort: 8
  name: Local Master
  description: 'Off: this server reports to the public masters only, so it needs just one allocation.'
  env_variable: RECLAIMER_DEDICATED_MASTER_ENABLED
  default_value: 'false'
  user_viewable: false
  user_editable: false
  rules:
  - required
  - in:false
